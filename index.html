<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Food Delivery Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/game.css?v=1">
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="markers"></div>
<div id="ui"></div>

<div id="boot">
  <div class="boot-inner">
    <div class="logo"><span class="l1">Food</span><span class="l2">Delivery</span><span class="l3">Simulator</span></div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div id="boot-msg">Warming up the scooter…</div>
  </div>
</div>
<script>
  // Plain-script guard: if the module never starts, say why instead of a blank screen (and tell analytics, once —
  // through js/analytics.js when it loaded, else with a bare beacon in the same format).
  window.__bootErr = function (msg) {
    var m = document.getElementById('boot-msg'); if (m) m.textContent = 'Could not start: ' + msg;
    if (window.__bootSent) return; window.__bootSent = 1;
    try {
      msg = String(msg).slice(0, 200);
      if (window.__an) return window.__an('boot_fail', { msg: msg });
      var an = localStorage.getItem('fds_an');
      if (navigator.webdriver || an === 'off' || !navigator.sendBeacon) return;
      var id = function (p) { return p + Math.random().toString(36).slice(2) + Date.now().toString(36); };
      var pid = localStorage.getItem('fds_pid'); if (!pid) { pid = id('p'); localStorage.setItem('fds_pid', pid); }
      navigator.sendBeacon('api/collect.php', new Blob([JSON.stringify({ v: 1, pid: pid, sid: id('s'), now: Date.now(), dev: an === 'dev' ? 1 : 0,
        ctx: { ua: navigator.userAgent, lang: navigator.language, scr: screen.width + 'x' + screen.height, touch: matchMedia('(pointer: coarse)').matches ? 1 : 0 },
        ev: [{ i: 0, t: Date.now(), n: 'boot_fail', p: { msg: msg } }] })], { type: 'text/plain' }));
    } catch (e) { /* private mode: nothing to do */ }
  };
  window.addEventListener('error', function (e) { if (!window.ready) window.__bootErr(e.message || 'script error'); });
  setTimeout(function () { if (!window.__started) window.__bootErr('this browser does not support the game (needs WebGL + ES modules)'); }, 25000);
</script>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
